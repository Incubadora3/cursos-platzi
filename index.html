<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURSOS PLATZI — INCUBADORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a1628; --sidebar: #0d1f3a; --accent: #e8a020; --text: #e8e8e8; --border: rgba(255,255,255,0.07); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header img { height: 30px; }
        .menu-label { padding: 15px 20px; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; background: rgba(0,0,0,0.2); }
        .video-item { padding: 12px 20px; cursor: pointer; font-size: 0.85rem; color: #aaa; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .video-item:hover { background: #112240; color: #fff; }
        .video-item.active { color: var(--accent); background: #152a4a; font-weight: bold; border-left: 3px solid var(--accent); }
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 15px 25px; background: #0d1f3a; border-bottom: 1px solid var(--border); }
        .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: #fff; }
        .video-wrapper { flex: 1; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .controls { padding: 20px; display: flex; justify-content: center; gap: 15px; background: #0d1f3a; border-top: 1px solid var(--border); }
        .btn { padding: 12px 35px; border-radius: 50px; border: none; background: #22334d; color: #fff; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn:hover { background: var(--accent); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="sidebar-header"><img src="incubadora_logo_blanco.png"></div>
        <div class="menu-label">CLASES INCUBADORA</div>
        <div id="video-list"></div>
    </nav>
    <main class="main">
        <div class="topbar"><div id="display-title" class="topbar-title">Cargando...</div></div>
        <div class="video-wrapper"><iframe id="main-player" allowfullscreen></iframe></div>
        <div class="controls">
            <button class="btn" onclick="changeVideo(-1)">⬅ Anterior</button>
            <button class="btn" onclick="changeVideo(1)">Siguiente ➡</button>
        </div>
    </main>
    <script>
        const playlist = [
            { title: "C 01 E 16 — VPN Y MFA En Equipos Remotos", id: "c-01-e-16-vpn-y-mfa-en-equipos-remotos" },
            { title: "C 02 E 13 — Playgrounds De IA", id: "c-02-e-13-playgrounds-de-ia" },
            { title: "C 03 E 05 — Runway LFF Transforma Videos", id: "c-03-e-05-runway-lff-transforma-videos" },
            { title: "C 04 E 07 — Analisis Documentos Perplexity", id: "c-04-e-07-analisis-documentos-perplexity" },
            { title: "C 05 E 17 — Retoque Digital Imagenes IA", id: "c-05-e-17-retoque-digital-imagenes-ia" }
        ];
        let currentIndex = 0;
        function initMenu() {
            const container = document.getElementById('video-list');
            container.innerHTML = playlist.map((vid, index) => `<div class="video-item" id="item-${index}" onclick="loadVideo(${index})">${vid.title}</div>`).join('');
            loadVideo(0);
        }
        function loadVideo(index) {
            currentIndex = index;
            const video = playlist[currentIndex];
            document.getElementById('main-player').src = `https://archive.org/embed/${video.id}?autoplay=1`;
            document.getElementById('display-title').textContent = video.title;
            document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`item-${index}`).classList.add('active');
        }
        function changeVideo(direction) {
            let nextIndex = currentIndex + direction;
            if (nextIndex >= 0 && nextIndex < playlist.length) loadVideo(nextIndex);
        }
        window.onload = initMenu;
    </script>
</body>
</html>
