<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURSOS PLATZI — INCUBADORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a1628; --sidebar: #0d1f3a; --accent: #e8a020; --text: #e8e8e8; --border: rgba(255,255,255,0.07); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar con Acordeón */
        .sidebar { width: 300px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header img { height: 32px; }
        
        .course-header { padding: 15px 20px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--accent); background: rgba(0,0,0,0.1); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .course-header:hover { background: rgba(232, 160, 32, 0.1); }
        
        .chapter-list { display: none; background: rgba(0,0,0,0.2); }
        .chapter-list.active { display: block; }
        
        .video-item { padding: 10px 25px; cursor: pointer; font-size: 0.8rem; color: #aaa; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .video-item:hover { color: #fff; background: #112240; }
        .video-item.playing { color: var(--accent); background: #152a4a; font-weight: bold; border-left: 3px solid var(--accent); }

        /* Contenido Principal */
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 15px 25px; background: #0d1f3a; border-bottom: 1px solid var(--border); }
        .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; }
        .video-wrapper { flex: 1; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .controls { padding: 20px; display: flex; justify-content: center; gap: 15px; background: #0d1f3a; }
        .btn { padding: 12px 35px; border-radius: 50px; border: none; background: #22334d; color: #fff; cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--accent); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header"><img src="https://incubadora3.github.io/cursos-platzi/logo.png" alt="GRÉKOS"></div>
        <div id="accordion-menu"></div>
    </nav>

    <main class="main">
        <div class="topbar"><div id="display-title" class="topbar-title">Selecciona una clase</div></div>
        <div class="video-wrapper"><iframe id="main-player" allowfullscreen></iframe></div>
        <div class="controls">
            <button class="btn" onclick="changeVideo(-1)">⬅ Anterior</button>
            <button class="btn" onclick="changeVideo(1)">Siguiente ➡</button>
        </div>
    </main>

    <script>
       const courses = [
    {
        // Título corregido según tu indicación
        name: "C01 · VPN Y MFA EN EQUIPOS REMOTOS",
        chapters: [
            { title: "C01E01 — Productividad", id: "c01e01-productividad" },
            { title: "C01E02 — Productividad II", id: "c01e02-productividad" },
            { title: "C01E03 — Trabajo Remoto Modelos", id: "c01e03-trabajo-remoto-modelos" },
            { title: "C01E04 — Como el Micrófono", id: "c01e04-como-el-microfono" },
            { title: "C01E05 — Acuerdos Mentales", id: "c01e05-acuerdos-mentales" },
            { title: "C01E06 — Chat vs Correo", id: "c01e06-chat-vs-correo" },
            { title: "C01E08 — Protocolo Instrucciones Claras", id: "c01e08-protocolo-de-validacion-para-instrucciones-claras" },
            { title: "C01E09 — Mapeo Digital de Procesos", id: "c01e09-mapeo-digital-de-procesos-en-equipos-remotos" },
            { title: "C01E10 — Conectar Herramientas Colaborativas", id: "c01e10-conectar-herramientas-de-trabajo-colaborativo" },
            { title: "C01E11 — Sincroniza Calendario y Chat", id: "c01e11-sincroniza-calendario-y-chat-para-proteger-tu-concentracion" },
            { title: "C01E12 — Ceremonias Scrum en Remoto", id: "c01e12-ceremonias-de-scrum-en-equipos-remotos" },
            { title: "C01E13 — Reclutamiento Ventana Colaboración", id: "c01e13-reclutamiento-global-ventana-de-colaboracion-y-onboarding-remoto" },
            { title: "C01E14 — Seis Fases Migrar Trabajo Remoto", id: "c01e14-seis-fases-para-migrar-a-trabajo-remoto" },
            { title: "C01E15 — Métricas Actividad vs Resultados", id: "c01e15-metricas-de-actividad-vs-metricas-de-resultado" },
            { title: "C01E16 — VPN Y MFA En Equipos Remotos", id: "c-01-e-16-vpn-y-mfa-en-equipos-remotos" }
        ]
    }
    // Después puedes seguir agregando C02, C03, etc.
];

        let flatPlaylist = [];
        let currentIndex = 0;

        function init() {
            const menu = document.getElementById('accordion-menu');
            courses.forEach((course, cIdx) => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="course-header" onclick="toggleCourse(${cIdx})">
                        ${course.name} <span>▼</span>
                    </div>
                    <div class="chapter-list" id="course-${cIdx}">
                        ${course.chapters.map((ch, chIdx) => {
                            const globalIdx = flatPlaylist.length;
                            flatPlaylist.push(ch);
                            return `<div class="video-item" id="item-${globalIdx}" onclick="loadVideo(${globalIdx})">${ch.title}</div>`;
                        }).join('')}
                    </div>
                `;
                menu.appendChild(section);
            });
            loadVideo(0);
        }

        function toggleCourse(idx) {
            const list = document.getElementById(`course-${idx}`);
            list.classList.toggle('active');
        }

        function loadVideo(index) {
            currentIndex = index;
            const video = flatPlaylist[currentIndex];
            document.getElementById('main-player').src = `https://archive.org/embed/${video.id}?autoplay=1`;
            document.getElementById('display-title').textContent = video.title;
            document.querySelectorAll('.video-item').forEach(el => el.classList.remove('playing'));
            document.getElementById(`item-${index}`).classList.add('playing');
        }

        function changeVideo(dir) {
            let next = currentIndex + dir;
            if (next >= 0 && next < flatPlaylist.length) loadVideo(next);
        }

        window.onload = init;
    </script>
</body>
</html>
