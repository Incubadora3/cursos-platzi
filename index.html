<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CURSOS PLATZI — INCUBADORA</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a1628; --sidebar: #0d1f3a; --accent: #e8a020; --text: #e8e8e8; --border: rgba(255,255,255,0.07); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        
        .sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); text-align: center; }
        .sidebar-header img { height: 32px; }
        
        .course-header { padding: 15px 20px; cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--accent); background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .course-header:hover { background: rgba(232, 160, 32, 0.1); }
        
        .chapter-list { display: none; background: rgba(0,0,0,0.3); }
        .chapter-list.active { display: block; }
        
        .video-item { padding: 10px 25px; cursor: pointer; font-size: 0.8rem; color: #aaa; border-bottom: 1px solid rgba(255,255,255,0.02); transition: 0.2s; }
        .video-item:hover { color: #fff; background: #112240; }
        .video-item.playing { color: var(--accent); background: #152a4a; font-weight: bold; border-left: 3px solid var(--accent); }

        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 15px 25px; background: #0d1f3a; border-bottom: 1px solid var(--border); }
        .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: #fff; }
        
        .video-wrapper { flex: 1; background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .controls { padding: 20px; display: flex; justify-content: center; gap: 15px; background: #0d1f3a; border-top: 1px solid var(--border); }
        .btn { padding: 12px 35px; border-radius: 50px; border: none; background: #22334d; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--accent); transform: translateY(-2px); }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="sidebar-header"><img src="https://incubadora3.github.io/cursos-platzi/logo.png" alt="INCUBADORA"></div>
        <div id="accordion-menu"></div>
    </nav>

    <main class="main">
        <div class="topbar"><div id="display-title" class="topbar-title">Selecciona una clase</div></div>
        <div class="video-wrapper"><iframe id="main-player" allowfullscreen></iframe></div>
        <div class="controls">
            <button class="btn" onclick="changeVideo(-1)">⬅ Anterior</button>
            <button class="btn" onclick="changeVideo(1)">Siguiente ➡</button>
        </div>
    </main>

    <script>
      const courses = [
    {
        name: "C04 · ANÁLISIS DOCUMENTOS PERPLEJIDAD",
        archiveId: "c-04-e-07-analisis-documentos-perplexity",
        chapters: [
            { title: "C04E01 — Respuestas verificables", index: 0 },
            { title: "C04E02 — Conoce Perplejidad AI", index: 1 },
            { title: "C04E03 — Plan Perplejidad", index: 2 },
            { title: "C04E04 — Versiones Perplexity", index: 3 },
            { title: "C04E05 — Prompts Perplejidad", index: 4 },
            { title: "C04E06 — Investigación Profunda", index: 5 },
            { title: "C04E07 — Análisis documentos Perplejidad", index: 6 },
            { title: "C04E08 — Combina Perplejidad", index: 7 },
            { title: "C04E09 — Pantallas temáticas", index: 8 },
            { title: "C04E10 — Espacios tareas", index: 9 },
            { title: "C04E11 — Aplicaciones HTML", index: 10 },
            { title: "C04E12 — Recorte diario IA", index: 11 },
            { title: "C04E13 — Perplexity Comet", index: 12 }
        ]
    },
    {
        name: "C05 · RETOQUE DIGITAL IMAGENES IA",
        archiveId: "c-05-e-17-retoque-digital-imagenes-ia", // Basado en el cap 17 que mencionaste
        chapters: [
            { title: "C05E01 — Imágenes IA Marketing", index: 0 },
            { title: "C05E02 — Creatividad AI", index: 1 },
            { title: "C05E03 — Ética Imágenes IA", index: 2 },
            { title: "C05E04 — Formatos Aspectos", index: 3 },
            { title: "C05E05 — Modelos IA", index: 4 },
            { title: "C05E06 — Anatomía Prompts", index: 5 },
            { title: "C05E07 — Mejorando Imágenes", index: 6 },
            { title: "C05E08 — Producto Flux IA", index: 7 },
            { title: "C05E09 — Prototipado Photoshop", index: 8 },
            { title: "C05E10 — Loras Flux", index: 9 },
            { title: "C05E11 — Modelos Personalizados", index: 10 },
            { title: "C05E12 — Midjourney Discord", index: 11 },
            { title: "C05E13 — Interfaz web Midjourney", index: 12 },
            { title: "C05E14 — Parámetros Avanzados", index: 13 },
            { title: "C05E15 — Estilización", index: 14 },
            { title: "C05E16 — Marketing Prototipado", index: 15 },
            { title: "C05E17 — Retoque Digital Imágenes IA", index: 16 }
        ]
    }
];
    

        let flatPlaylist = [];
        let currentIndex = 0;

        function init() {
            const menu = document.getElementById('accordion-menu');
            courses.forEach((course, cIdx) => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="course-header" onclick="toggleCourse(${cIdx})">
                        ${course.name} <span>▼</span>
                    </div>
                    <div class="chapter-list" id="course-${cIdx}">
                        ${course.chapters.map((ch) => {
                            const globalIdx = flatPlaylist.length;
                            flatPlaylist.push(ch);
                            return `<div class="video-item" id="item-${globalIdx}" onclick="loadVideo(${globalIdx})">${ch.title}</div>`;
                        }).join('')}
                    </div>
                `;
                menu.appendChild(section);
            });
            loadVideo(0);
        }

        function toggleCourse(idx) {
            document.getElementById(`course-${idx}`).classList.toggle('active');
        }

        function loadVideo(index) {
            currentIndex = index;
            const video = flatPlaylist[currentIndex];
            document.getElementById('main-player').src = `https://archive.org/embed/${video.id}?autoplay=1`;
            document.getElementById('display-title').textContent = video.title;
            document.querySelectorAll('.video-item').forEach(el => el.classList.remove('playing'));
            document.getElementById(`item-${index}`).classList.add('playing');
        }

        function changeVideo(dir) {
            let next = currentIndex + dir;
            if (next >= 0 && next < flatPlaylist.length) loadVideo(next);
        }

        window.onload = init;
    </script>
</body>
</html>
